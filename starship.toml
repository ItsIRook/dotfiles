# Don't print a new line at the start of the prompt
add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#52677d'

[character]
success_symbol = "[ ](bold fg:#8faedc)"
error_symbol = "[ ](bold fg:#c47b67)"

[package]
disabled = true

[git_branch]
style = "bg:#52677d"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#52677d)[$symbol $branch(:$remote_branch)](fg:#d0d3df bg:#52677d)[ ](bold fg:#52677d)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:#d19a5b)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](fg:#9db99a)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:#52677d bold fg:#d0d3df)[](bold fg:#52677d)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold fg:#9db99a"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#52677d fg:#d0d3df"
style_root = "fg:#c47b67 bold"
format = "[](bold fg:#52677d)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#303e4b fg:#b8bac8"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#303e4b)[󰉋 → $path]($style)[](bold fg:#303e4b)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#52677d)[󰪢 $duration](bold bg:#52677d fg:#d0d3df)[](bold fg:#52677d)'
